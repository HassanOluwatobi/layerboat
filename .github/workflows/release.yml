name: Release

# Every change to main builds the download zip. When the version is new, it is
# published as a release. Bump the version in after-effects/layerboat-core.jsx to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the helper
        run: sh relay/build.sh
      - name: Build the download
        run: python tools/build_release.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls release/dist/*.zip | head -1)
          ver=$(basename "$zip" .zip | sed 's/^LayerBoat //')
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "v$ver is already released"; exit 0
          fi
          gh release create "v$ver" "$zip" --target "$GITHUB_SHA" \
            --title "LayerBoat $ver" --notes-file release/NOTES.md
