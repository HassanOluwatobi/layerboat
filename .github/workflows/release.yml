name: Release

# Push a tag like v1.5 and this builds the download zip and publishes it as a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the helper
        run: sh relay/build.sh
      - name: Build the download
        run: python tools/build_release.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls release/dist/*.zip | head -1)
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "LayerBoat ${GITHUB_REF_NAME#v}" \
            --notes-file release/NOTES.md
